# docker-compose.yml
# Services will be defined here as each pipeline stage is implemented.
#
# Planned services:
#   api       — FastAPI async REST service (job submission + status polling)
#   worker    — Pipeline worker (PDF parsing → segmentation → LLM extraction → XML generation)
#   llm       — LLM runner (Ollama or HuggingFace TGI, swappable)
#
# Shared volumes:
#   ./data/PDF     — input PDFs (mounted read-only by worker)
#   ./data/output  — output XMLs and ZIPs
#   ./data/jobs    — job queue (file-based for MVP)
